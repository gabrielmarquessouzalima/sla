<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço do Gabriel - Perspectiva</title>
    <style>
        /* Efeito de Respiração (Câmera subindo e descendo levemente) */
        @keyframes respiracao {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        body {
            background: radial-gradient(circle at center, #1a002e 0%, #000a50 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            animation: respiracao 6s ease-in-out infinite; /* Simula o peito subindo/descendo */
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1.5s ease;
        }

        #btn-entrar {
            padding: 15px 30px;
            background: transparent;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            border-radius: 5px;
        }

        /* --- LUA CENTRALIZADA (O FOCO DO OLHAR) --- */
        .lua {
            position: absolute;
            top: 40%;
            left: 50%;
            width: 120px;
            height: 120px;
            background-color: transparent;
            border-radius: 50%;
            box-shadow: 15px 10px 40px 5px rgba(255, 255, 230, 0.4);
            transform: translate(-50%, -50%) rotate(-15deg);
            z-index: 1;
        }
        .lua::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: inset -25px 0 0 0 rgba(255, 255, 255, 0.9);
        }

        /* --- RAYQUAZA CIRCULANDO --- */
        .rayquaza-fundo {
            position: absolute;
            top: 35%;
            left: 45%;
            width: 80px;
            opacity: 0.4;
            z-index: 2;
            animation: orbitar 20s linear infinite;
        }

        @keyframes orbitar {
            from { transform: rotate(0deg) translateX(150px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
        }

        /* --- GRAMA MOLDURANDO A TELA --- */
        #container-grama {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        .grama-blade {
            position: absolute;
            background: linear-gradient(to top, #000 0%, #0d1a00 100%);
            transform-origin: bottom center;
            filter: blur(2px); /* Blur para dar profundidade de campo (perto do olho) */
        }

        /* --- CONTEÚDO CENTRAL --- */
        .conteudo {
            position: relative;
            z-index: 5;
            text-align: center;
        }

        h1 { margin: 0; font-size: 2rem; color: rgba(255,255,255,0.7); }
        .texto-vermelho { color: #ff3333; font-size: 40px; text-shadow: 0 0 10px red; }
        
        .meu-gif {
            width: 200px;
            opacity: 0.8;
            mask-image: radial-gradient(circle, black 50%, transparent 100%);
        }

        #chuva {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        iframe { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="btn-entrar">DEITAR NA GRAMA</button>
    </div>

    <canvas id="chuva"></canvas>
    <div id="container-grama"></div>
    <div id="player-container"></div>

    <div class="lua"></div>
    
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/384.gif" 
         alt="Rayquaza" class="rayquaza-fundo">

    <div class="conteudo">
        <h1>Gabriel</h1>
        <h1 class="texto-vermelho">hello world!</h1>
        <img src="https://media1.tenor.com/m/h1avbRkVQFIAAAAC/butcher-vanity-vane-lily.gif"
             alt="Butcher Vanity" class="meu-gif">
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('btn-entrar');
        const gramaContainer = document.getElementById('container-grama');
        const canvas = document.getElementById('chuva');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Chuva caindo em direção ao rosto (Radial)
        let gotas = [];
        function criarGota() {
            return {
                x: Math.random() * canvas.width - canvas.width / 2,
                y: Math.random() * canvas.height - canvas.height / 2,
                z: Math.random() * 1000,
                vel: 15
            };
        }

        for (let i = 0; i < 150; i++) gotas.push(criarGota());

        function animarChuva() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            gotas.forEach(g => {
                g.z -= g.vel;
                if (g.z <= 0) Object.assign(g, criarGota());

                const escala = 600 / (600 + g.z);
                const x2d = g.x * escala + cx;
                const y2d = g.y * escala + cy;
                
                ctx.beginPath();
                ctx.strokeStyle = `rgba(200, 220, 255, ${escala * 0.5})`;
                ctx.lineWidth = escala * 2;
                ctx.moveTo(x2d, y2d);
                ctx.lineTo(x2d + (g.x * 0.02), y2d + (g.y * 0.02));
                ctx.stroke();
            });
            requestAnimationFrame(animarChuva);
        }

        function gerarGrama() {
            const total = 60;
            for (let i = 0; i < total; i++) {
                const blade = document.createElement('div');
                blade.className = 'grama-blade';
                
                // Distribui nas bordas (cima, baixo, lados) para fechar o "buraco" do olhar
                const lado = Math.floor(Math.random() * 4);
                let x, y, rot;

                if(lado === 0) { // Baixo
                    x = Math.random() * 100; y = 95; rot = Math.random() * 40 - 20;
                } else if(lado === 1) { // Topo (invertida)
                    x = Math.random() * 100; y = 5; rot = 180 + (Math.random() * 40 - 20);
                } else if(lado === 2) { // Esquerda
                    x = 5; y = Math.random() * 100; rot = 90 + (Math.random() * 40 - 20);
                } else { // Direita
                    x = 95; y = Math.random() * 100; rot = -90 + (Math.random() * 40 - 20);
                }

                const alt = 150 + Math.random() * 200;
                blade.style.width = '15px';
                blade.style.height = alt + 'px';
                blade.style.left = x + '%';
                blade.style.top = y + '%';
                blade.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
                blade.style.opacity = 0.4 + Math.random() * 0.4;
                
                gramaContainer.appendChild(blade);
            }
        }

        btn.addEventListener('click', () => {
            overlay.style.opacity = '0';
            gerarGrama();
            setTimeout(() => {
                overlay.style.display = 'none';
                animarChuva();
            }, 1000);
            
            document.getElementById('player-container').innerHTML = `
                <iframe src="https://www.youtube.com/embed/iymkhH754bo?autoplay=1&loop=1&playlist=iymkhH754bo" allow="autoplay"></iframe>`;
        });
    </script>
</body>
</html>

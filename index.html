<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço do Gabriel</title>
    <style>
        /* ... Seus estilos anteriores do overlay e lua ... */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000;
            transition: opacity 1s ease;
        }

        #btn-entrar {
            padding: 15px 30px;
            font-size: 20px;
            background: transparent;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
        }

        #chuva {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3; 
            pointer-events: none;
        }

        /* --- SISTEMA DE GRAMA MELHORADO --- */
        #container-grama {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200; 
            opacity: 0;
            transition: opacity 2s ease;
        }

        .grama-blade {
            position: absolute;
            background: linear-gradient(to top, #000 0%, #081200 40%, #1a2e00 100%);
            border-radius: 100% 100% 0 0 / 100% 100% 0 0;
            filter: blur(2px);
        }

        @keyframes balanco-suave {
            0%, 100% { transform: rotate(var(--rot-base)) scaleY(1); }
            50% { transform: rotate(var(--rot-move)) scaleY(1.08); }
        }

        /* --- RESTO DO SEU ESTILO --- */
        body {
            background: radial-gradient(1px 1px at 20px 30px, white, rgba(0,0,0,0)),
                        linear-gradient(to bottom, rgb(0, 10, 80), #1a002e);
            background-size: 200px 200px, 100% 100%;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        .lua {
            position: absolute; top: 5%; right: 17%;
            width: 100px; height: 100px;
            border-radius: 50%;
            box-shadow: 25px 10px 0 0 rgba(255, 255, 230, 0.9);
            z-index: 1; transform: rotate(15deg);
        }

        .texto-vermelho {
            color: #ff3333; font-size: 50px; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }
        
        .meu-gif { width: 300px; border-radius: 10px; z-index: 5; }
        iframe { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="btn-entrar">ENTRAR NO ESPAÇO</button>
    </div>

    <canvas id="chuva"></canvas>
    <div id="container-grama"></div>
    <div id="player-container"></div>
    <div class="lua"></div>

    <h1>Gabriel</h1>
    <h1 class="texto-vermelho">hello world!</h1>
    <img src="https://media1.tenor.com/m/h1avbRkVQFIAAAAC/butcher-vanity-vane-lily.gif" class="meu-gif">

    <script>
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('btn-entrar');
        const gramaContainer = document.getElementById('container-grama');

        function gerarGrama() {
            const totalFolhas = 120; // Aumentei a densidade
            
            for (let i = 0; i < totalFolhas; i++) {
                const blade = document.createElement('div');
                blade.className = 'grama-blade';
                
                const lado = Math.random();
                let posX, posY, inclinacaoBase, origem;

                if (lado < 0.33) { // Esquerda
                    posX = Math.random() * 15; // Fica na faixa da esquerda
                    posY = Math.random() * 110;
                    inclinacaoBase = 60 + Math.random() * 40; 
                    origem = "bottom left";
                } else if (lado < 0.66) { // Direita
                    posX = 85 + Math.random() * 15; // Fica na faixa da direita
                    posY = Math.random() * 110;
                    inclinacaoBase = -60 - Math.random() * 40;
                    origem = "bottom right";
                } else { // Baixo
                    posX = Math.random() * 100;
                    posY = 100;
                    inclinacaoBase = (posX < 50) ? (Math.random() * 20) : (Math.random() * -20);
                    origem = "bottom center";
                }
                
                const altura = window.innerHeight * (0.4 + Math.random() * 0.7);
                const largura = 20 + Math.random() * 40;
                const tempo = 3 + Math.random() * 3;

                blade.style.height = `${altura}px`;
                blade.style.width = `${largura}px`;
                blade.style.left = `${posX}%`;
                blade.style.top = `${posY}%`;
                blade.style.transformOrigin = origem;

                // Definindo as variáveis de rotação para o CSS
                blade.style.setProperty('--rot-base', `${inclinacaoBase}deg`);
                blade.style.setProperty('--rot-move', `${inclinacaoBase + (Math.random() > 0.5 ? 5 : -5)}deg`);
                
                blade.style.animation = `balanco-suave ${tempo}s ease-in-out infinite`;
                blade.style.animationDelay = `${Math.random() * -5}s`;
                
                // Quanto mais alta (perto da visão), mais borrada
                const blurValue = (altura / window.innerHeight) * 8;
                blade.style.filter = `blur(${blurValue}px)`;
                blade.style.opacity = 0.4 + Math.random() * 0.5;

                gramaContainer.appendChild(blade);
            }
        }

        btn.addEventListener('click', () => {
            overlay.style.opacity = '0';
            gerarGrama();
            gramaContainer.style.opacity = '1';
            setTimeout(() => {
                overlay.style.display = 'none';
                // (Aqui você chamaria suas funções de chuva e nuvens que já tem)
            }, 1000);

            document.getElementById('player-container').innerHTML = `
                <iframe src="https://www.youtube.com/embed/iymkhH754bo?autoplay=1&loop=1&playlist=iymkhH754bo" allow="autoplay"></iframe>`;
        });
    </script>
</body>
</html>

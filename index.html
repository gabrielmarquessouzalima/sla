<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço do Gabriel</title>
    <style>
        /* Reset e Base */
        body {
            margin: 0;
            padding: 0;
            background: 
                radial-gradient(1px 1px at 20px 30px, white, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, white, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, white, rgba(0,0,0,0)),
                linear-gradient(to bottom, rgb(0, 10, 80), #1a002e);
            background-size: 200px 200px, 200px 200px, 200px 200px, 100% 100%;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            overflow: hidden; /* Evita barras de rolagem */
            position: relative;
        }

        /* Tela de Entrada */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease, visibility 1s;
        }

        #btn-entrar {
            padding: 15px 30px;
            font-size: 20px;
            background: transparent;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        #btn-entrar:hover {
            background: white;
            color: black;
        }

        /* Elementos Visuais */
        #chuva {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; 
            pointer-events: none;
        }

        .lua {
            position: absolute;
            top: 5%; 
            right: 17%;
            width: 100px;
            height: 100px;
            background-color: transparent;
            border-radius: 50%;
            box-shadow: 25px 10px 0 0 rgba(255, 255, 230, 0.9);
            filter: blur(1px) drop-shadow(0 0 20px rgba(255, 255, 200, 0.4));
            z-index: 1; 
            transform: rotate(15deg);
        }

        .rayquaza-fundo {
            position: absolute;
            top: 8%;
            right: 18%;
            width: 70px;
            opacity: 0.6; 
            z-index: 1; 
            filter: blur(0.5px);
            animation: flutuar 4s ease-in-out infinite;
        }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-15px) translateX(5px); }
        }

        /* Grama */
        #container-grama {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .grama-blade {
            position: absolute;
            bottom: -10px;
            width: 8px;
            background: linear-gradient(to top, #000 0%, #081200 40%, #101d00 100%);
            border-radius: 40% 40% 0 0 / 100% 100% 0 0;
            transform-origin: bottom center;
        }

        @keyframes balanco-suave {
            0%, 100% { transform: rotate(var(--rot-base)) scaleY(1); }
            50% { transform: rotate(var(--rot-move)) scaleY(1.05); }
        }

        /* Nuvens */
        .nuvem {
            position: absolute;
            width: 150px;
            height: 50px;
            background: rgba(60, 70, 100, 0.3); 
            border-radius: 100px;
            filter: blur(30px); 
            z-index: 0;
            pointer-events: none;
        }

        /* Conteúdo Central */
        .mimikyu-topo { width: 80px; z-index: 5; margin-bottom: -10px; }
        .meu-gif {
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            z-index: 5;
        }

        h1 { z-index: 5; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8); margin: 10px 0; }
        .texto-vermelho {
            color: #ff3333;
            font-size: 45px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }

        #player-container { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="btn-entrar">ENTRAR NO ESPAÇO</button>
    </div>

    <canvas id="chuva"></canvas>
    <div id="container-grama"></div>
    <div id="player-container"></div>
    <div class="lua"></div>

    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/384.gif" 
         alt="Rayquaza" class="rayquaza-fundo">

    <h1>Gabriel</h1>

    <img src="https://media.tenor.com/dBsHOlc6L30AAAAj/mimikyu.gif" 
         alt="Mimikyu" class="mimikyu-topo">

    <h1 class="texto-vermelho">hello world!</h1>

    <img src="https://media1.tenor.com/m/h1avbRkVQFIAAAAC/butcher-vanity-vane-lily.gif"
         alt="Butcher Vanity" class="meu-gif">

    <script>
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('btn-entrar');
        const playerContainer = document.getElementById('player-container');
        const gramaContainer = document.getElementById('container-grama');
        const canvas = document.getElementById('chuva');
        const ctx = canvas.getContext('2d');

        // Configuração da Chuva
        let gotas = [];
        const numGotas = 100;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function criarGota() {
            return {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                z: Math.random() * 1000,
                velocidade: 15 + Math.random() * 5
            };
        }

        for (let i = 0; i < numGotas; i++) {
            gotas.push(criarGota());
        }

        function animarChuva() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            gotas.forEach(g => {
                g.y += g.velocidade;
                if (g.y > canvas.height) {
                    g.y = -20;
                    g.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.strokeStyle = 'rgba(180, 200, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.moveTo(g.x, g.y);
                ctx.lineTo(g.x, g.y + 15);
                ctx.stroke();
            });
            requestAnimationFrame(animarChuva);
        }

        function gerarGama() {
            const totalFolhas = 30;
            for (let i = 0; i < totalFolhas; i++) {
                const blade = document.createElement('div');
                blade.className = 'grama-blade';
                const ladoEsquerdo = i % 2 === 0;
                const posX = ladoEsquerdo ? (Math.random() * 15) : (85 + Math.random() * 15);
                const altura = window.innerHeight * (0.3 + Math.random() * 0.4);
                const inclinacaoBase = ladoEsquerdo ? (15 + Math.random() * 20) : (-15 - Math.random() * 20);
                
                blade.style.height = `${altura}px`;
                blade.style.left = `${posX}%`;
                blade.style.width = `${6 + Math.random() * 8}px`; 
                blade.style.setProperty('--rot-base', `${inclinacaoBase}deg`);
                blade.style.setProperty('--rot-move', `${inclinacaoBase + (ladoEsquerdo ? 5 : -5)}deg`);
                blade.style.animation = `balanco-suave ${4 + Math.random() * 3}s ease-in-out infinite`;
                blade.style.filter = `blur(${Math.random() * 2}px)`;

                gramaContainer.appendChild(blade);
            }
        }

        function criarNuvens() {
            for (let i = 0; i < 12; i++) {
                const nuvem = document.createElement('div');
                nuvem.className = 'nuvem';
                nuvem.style.top = Math.random() * 100 + 'vh';
                nuvem.style.left = Math.random() * 100 + 'vw'; 
                nuvem.style.transform = `scale(${1 + Math.random() * 2})`;
                document.body.appendChild(nuvem);
            }
        }

        // Evento de Início
        btn.addEventListener('click', () => {
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';
            
            gerarGama();
            gramaContainer.style.opacity = '1';
            animarChuva();
            criarNuvens(); 

            // Iframe de música (YouTube costuma bloquear autoplay sem mute, mas o clique ajuda)
            playerContainer.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/iymkhH754bo?autoplay=1&loop=1&playlist=iymkhH754bo" 
                    allow="autoplay">
                </iframe>`;
        });
    </script>
</body>
</html>
